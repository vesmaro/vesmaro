{{- if and (not .Values.auth.existingSecret) .Values.auth.totpMasterKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vesmaro.fullname" . }}
  labels:
    {{- include "vesmaro.labels" . | nindent 4 }}
type: Opaque
stringData:
  totp-master-key: {{ .Values.auth.totpMasterKey | quote }}
{{- end }}
