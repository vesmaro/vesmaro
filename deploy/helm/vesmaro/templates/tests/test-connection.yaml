apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vesmaro.fullname" . }}-test-connection"
  labels:
    {{- include "vesmaro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "{{ include "vesmaro.fullname" . }}:{{ .Values.service.port }}/health"]
