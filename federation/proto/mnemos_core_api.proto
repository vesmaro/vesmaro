// SPDX-License-Identifier: Apache-2.0
//
// mnemos-mesh ↔ mnemos Core API — Phase 3 contract (GitHub issue #105).
//
// Transport: Unix socket + gRPC. mnemos is the source of truth for storage
// and moderation. mesh is transport only — it does NOT decrypt payloads,
// does NOT access the SQLite store directly, does NOT run moderation. All
// moderation stays in Python (mnemos). Mesh forwards already-redacted
// CompactRecord envelopes.
//
// Why Unix socket + gRPC (not CGo, not shared SQLite):
//   * Criterion 6 — Versioned API boundary. mnemos = source of truth, mesh
//     = transport + subs + peer registry, NO shared DB.
//   * Criterion 8 — gRPC + protobuf. Peer API (federation.proto) + core
//     API (this file), Unix socket mesh↔mnemos.
//   * Criterion 11 — Local-first preserved. Each mnemos owns its DB; the
//     mesh is transport, not storage. Sharing the SQLite file would break
//     the local-first invariant and couple mesh to mnemos's storage layout.
//   * CGo would bind the Go binary to Python's CPython ABI and pull the
//     Python runtime into the mesh process — defeating the single-binary
//     distribution goal (criterion 12).
//
// Contract lineage:
//   * Architectural contract: .archcom/sessions/2026-07-17-federation-contract.md
//     §3.1 Batch sync, §3.2 Mediated pull.
//   * CompactRecord source of truth: mnemos/src/mnemos/compact.py (mirrors
//     federation.proto::CompactRecord — DO NOT drift).
//   * WriteMemory.import_mode mirrors mnemos_import MCP tool modes
//     (merge / restore); RESTORE requires confirm=true (hard gate), per
//     mnemos-operations.instructions.md (mnemos:operations §1 — the
//     restore-mode hard gate).
//   * CompactRecord.id uses the `fed:<source_agent>:<local_uuid>` prefix
//     so WriteMemory is idempotent by id (merge keyed on id — see
//     compact.py docstring and contract §2.3/§3.1).

syntax = "proto3";

package mnemos.core.v1;

// Go codegen import path + package name for the mnemos-mesh Go binary.
// Source of truth lives in the .proto (contract-first); this option makes
// the .proto self-describing for Go codegen so consumers (mnemos-mesh) do
// not need M-mappings in buf.gen.yaml. The `;mnemosmesh` suffix is the Go
// package name shared by both federation and core-api generated stubs.
option go_package = "github.com/Korrnals/mnemos-mesh/proto/gen;mnemosmesh";

import "federation.proto";

// ListMemoriesRequest — filter mnemos uses to export memories to the mesh.
//
// Mirrors the filter shape of the existing mnemos export / list APIs. The
// mesh calls this on startup/refresh to materialise the local view of what
// mnemos is willing to federate. include_no_federate=false by default so
// the mesh never even sees records that must not leave this node
// (contract §2.2.1 defence-in-depth layer 3 — moderation on export).
message ListMemoriesRequest {
  // Restrict to these project slugs. Empty = all projects mnemos is willing
  // to federate (mnemos-side filter still applies — this is an upper bound).
  repeated string projects = 1;

  // Restrict to these mnemos subtypes (e.g. "decision", "learning").
  // Empty = all subtypes.
  repeated string types = 2;

  // Include only records carrying at least one of these tags.
  repeated string tags_include = 3;

  // Exclude records carrying any of these tags.
  repeated string tags_exclude = 4;

  // If false (default), records tagged `mnemos:no-federate` are excluded
  // by mnemos before returning. The mesh never sees them. Setting this to
  // true is only valid for operator-side debugging tools, never for the
  // federation transport path.
  bool include_no_federate = 5;

  // ISO 8601 UTC timestamp — only records created at or after this time
  // are returned. Empty = no lower bound (used for incremental refresh).
  // LEGACY resume path (pre-ADR-0020 meshes): ignored whenever
  // `resume_cursor` is non-empty.
  string since = 6;

  // Maximum number of records to return in one response. 0 = mnemos default
  // (the server caps to a sane bound). The mesh uses has_more to paginate.
  int32 limit = 7;

  // Opaque resume checkpoint previously minted by mnemos-core in
  // ListMemoriesResponse.cursor (ADR-0020). OWNER: mnemos-core — the mesh
  // persists and replays it byte-for-byte and must NOT parse, validate, or
  // generate it (criterion 1 — dumb transport).
  //
  // Semantics:
  //   * non-empty → TAKES PRIORITY over `since` (since is ignored);
  //     core returns records strictly AFTER the checkpoint, with the same
  //     scope filters as the original listing.
  //   * empty → legacy behaviour (`since`-driven incremental refresh;
  //     pre-ADR-0020 meshes keep working unchanged).
  //   * unknown format / malformed / not minted by this core →
  //     INVALID_ARGUMENT. Never silently reinterpreted, never guessed:
  //     the mesh then degrades to a fresh subscribe (empty resume_cursor).
  string resume_cursor = 8;
}

// ListMemoriesResponse — page of CompactRecord bodies from mnemos.
message ListMemoriesResponse {
  // The CompactRecord bodies for this page. Each is already moderation-
  // processed (secrets redacted, PII anonymised) — mesh forwards as-is.
  repeated mnemos.federation.v1.CompactRecord records = 1;

  // Total number of records matching the filter (across all pages). Used
  // by the mesh for progress reporting, not for pagination control.
  int32 total = 2;

  // True if more pages are available. The mesh should re-call
  // ListMemories with `resume_cursor` set to the last minted cursor (or,
  // on legacy meshes, an adjusted `since`/`limit`) to fetch the next page.
  bool has_more = 3;

  // Opaque continuation checkpoint minted by mnemos-core (ADR-0020,
  // archcom 2026-09-20). Semantics: "everything matching this filter up to
  // and including this checkpoint has been delivered in this response" —
  // replaying it in ListMemoriesRequest.resume_cursor yields exactly the
  // not-yet-delivered remainder.
  //
  // OWNER: mnemos-core. The format is core-private and may change between
  // core versions WITHOUT a wire break. The mesh echoes it byte-for-byte:
  // persist it, replay it, never parse it (criterion 1).
  //
  //   * non-empty iff this response contains >= 1 record;
  //   * empty response → empty cursor = "nothing new" (an old core without
  //     this field also yields "" — the mesh degrades to fresh-subscribe,
  //     already implemented in mesh v1.1.1).
  string cursor = 4;
}

// ReadMemoryRequest — fetch a single record by id (W3-v1 gateway read path,
// ADR-0018 amendment 3 + ADR-0018-T §Status: ReadMemory is the additive
// core-proto RPC that did not exist in mnemos_core_api.proto before W3).
//
// The mesh's AgentGateway service (agent_gateway.proto) terminates agent
// RPCs and forwards them here over the existing core leg — the mesh never
// resolves content ACLs itself (criterion 5): mnemos re-derives the agent
// identity from the token forwarded in gRPC metadata and applies the
// fail-closed scope gate (token scope ∩ transport-peer ACL, ADR-0018-T §3).
message ReadMemoryRequest {
  // The CompactRecord id to fetch (`fed:<source_agent>:<local_uuid>` or a
  // locally-minted id seen in a prior ListMemories/AgentListMemories page).
  // Unknown id → NOT_FOUND. Id present but outside the caller's effective
  // scope → PERMISSION_DENIED (fail-closed, same contract as ListMemories).
  string record_id = 1;

  // Optional project scope narrowing. Empty = resolve by id alone; the
  // mnemos-side effective-scope gate still applies either way. Carried
  // explicitly so the audit log can attribute the request to a project
  // without parsing the record body.
  string project = 2;
}

// ReadMemoryResponse — a single moderation-processed CompactRecord.
message ReadMemoryResponse {
  // The requested record, already moderation-processed (secrets redacted,
  // PII anonymised) — identical guarantees to ListMemoriesResponse.records.
  mnemos.federation.v1.CompactRecord record = 1;

  // Trigger code describing the outcome (contract §9). EXHAUSTIVE on a
  // clean fetch; REFUSED when moderation could not sanitize the record.
  mnemos.federation.v1.TriggerCodes trigger_code = 2;
}

// ImportMode — mirrors the mnemos_import MCP tool modes (merge / restore).
//
// Source: mnemos-operations.instructions.md §1 ("restore = wipe all then
// import (requires confirm=true) — hard gate"). The mesh must NOT attempt
// to invent a third mode; RESTORE is destructive and gated.
enum ImportMode {
  // Default 0 — must be present per proto3 convention. Well-formed
  // requests always set MERGE or RESTORE explicitly; UNSPECIFIED is
  // rejected by mnemos as an invalid request.
  IMPORT_MODE_UNSPECIFIED = 0;

  // MERGE — insert new records, skip-or-overwrite existing (idempotent
  // merge keyed on CompactRecord.id). Safe to retry. The default mode
  // for federation transport.
  MERGE = 1;

  // RESTORE — wipe all existing data, then import. DESTRUCTIVE. mnemos
  // rejects this unless `confirm` is true (hard gate). Used for
  // operator-driven disaster recovery, NOT for routine federation.
  RESTORE = 2;
}

// WriteMemoryRequest — mesh imports a record into mnemos.
//
// Idempotent by CompactRecord.id (the `fed:<source_agent>:<local_uuid>`
// prefix guarantees global uniqueness). Replaying the same record is safe.
message WriteMemoryRequest {
  // The CompactRecord to write. Already moderation-processed by the peer
  // of origin; mnemos may apply its own import validation (#86) on top.
  mnemos.federation.v1.CompactRecord record = 1;

  // Import mode (MERGE / RESTORE). See ImportMode doc.
  ImportMode import_mode = 2;

  // RESTORE hard gate: must be true when import_mode=RESTORE, false
  // otherwise. mnemos rejects RESTORE without confirm=true. Mirrors
  // mnemos-operations.instructions.md §1 (the restore-mode hard gate).
  bool confirm = 3;
}

// WriteMemoryResponse — result of a WriteMemory call.
message WriteMemoryResponse {
  // The id of the written record (same as WriteMemoryRequest.record.id
  // on success). Echoed so the mesh can correlate with its pending queue.
  string written_id = 1;

  // The mode actually applied. May differ from the request if mnemos
  // downgraded RESTORE→MERGE (e.g. confirm was missing → mnemos refuses
  // RESTORE and falls back to MERGE, recording the downgrade in its
  // audit log). The mesh must surface this to the operator.
  ImportMode mode_applied = 2;

  // Trigger code describing the outcome (contract §9). EXHAUSTIVE on a
  // clean merge; REFUSED if mnemos rejected the record (import validation
  // failure, contract violation, oversized content); PARTIAL if only some
  // fields were accepted.
  mnemos.federation.v1.TriggerCodes trigger_code = 3;
}

// GetSubscriptionStateRequest — ask mnemos for the persisted subscription
// cursor for a peer+project. Used by the mesh on (re)connect to decide
// where to resume the stream from.
message GetSubscriptionStateRequest {
  // A2A id of the peer whose subscription state is requested.
  string peer_id = 1;

  // Project scope the subscription is bound to.
  string project_scope = 2;
}

// GetSubscriptionStateResponse — mnemos's persisted cursor/watermark.
message GetSubscriptionStateResponse {
  // Last persisted resume token for this peer+project. Empty if no prior
  // subscription existed (mesh should start a fresh Subscribe with an
  // empty cursor). Opaque to the mesh — pass it back to B verbatim.
  string cursor = 1;

  // Last watermark (revision number) mnemos has recorded for this peer.
  // Mirrors MetadataSyncResponse.latest_rev. 0 means "no prior state".
  int64 last_rev = 2;

  // ISO 8601 UTC timestamp of the last sync. Used for staleness reporting
  // in the mesh dashboard, not for protocol control.
  string last_sync_timestamp = 3;
}

// HeartbeatRequest — liveness probe between mesh and mnemos.
//
// Used both ways (mesh→mnemos and mnemos→mesh) over the Unix socket. Cheap
// unary call; failure to respond within a configured timeout marks the
// peer component as unhealthy.
message HeartbeatRequest {
  // A2A id of the probing peer.
  string peer_id = 1;

  // Which component is probing — "mesh" or "mnemos". Lets the receiver
  // record provenance in its health log without guessing from the socket.
  string component = 2;
}

// HeartbeatResponse — liveness reply.
message HeartbeatResponse {
  // True if the responder is healthy and ready to serve.
  bool healthy = 1;

  // Responder's build version (e.g. "mnemos 2.11.0" or "mnemos-mesh 0.1.0").
  string version = 2;

  // Responder's uptime in seconds. Useful for detecting a silently
  // restarted peer (version same, uptime low).
  int64 uptime_seconds = 3;
}

// UpsertIndexEntriesRequest — S2 meta-mirror IMPORT leg (ADR-0021 Q10.2/
// Q10.3, chairman ruling 2026-09-20). The mesh delivers MetadataRecord
// entries learned from a peer into the receiving core's federation_index.
//
// Deliberately a SEPARATE RPC from WriteMemory (chairman ruling: purity of
// semantics — WriteMemory is content, UpsertIndexEntries is index-only
// metadata; the ACL model is the same fail-closed per-peer gate).
//
// Idempotent by MetadataRecord.id with LWW-by-timestamp conflict
// resolution (ADR-0021 ruling Q10.6): replaying a batch is safe.
message UpsertIndexEntriesRequest {
  // The metadata entries to upsert. Each is validated at the boundary
  // (id non-empty, title ≤256, known content_state, pinned
  // schema_version) and passes the Q10.9 import gates (title-regex
  // blocklist, mnemos:no-federate tag). Invalid/gated entries are
  // COUNTED, never abort the batch.
  repeated mnemos.federation.v1.MetadataRecord entries = 1;
}

// UpsertIndexEntriesResponse — per-batch import counters.
message UpsertIndexEntriesResponse {
  // Entries actually written to federation_index (inserted or replaced
  // by LWW). NOTE: accepted + rejected_by_gate need not total the
  // request size — an entry that loses LWW to a NEWER stored row is
  // neither accepted nor rejected (it is silently superseded; the core
  // logs the stale count).
  int32 accepted = 1;

  // Entries refused by the boundary gates: Q10.9 title blocklist,
  // mnemos:no-federate tag, schema validation failure (unknown
  // content_state, oversized title, foreign schema_version).
  int32 rejected_by_gate = 2;

  // EXHAUSTIVE on a served batch. A whole-RPC ACL violation does not
  // reach this response — it surfaces as gRPC PERMISSION_DENIED (same
  // fail-closed write-path contract as WriteMemory).
  mnemos.federation.v1.TriggerCodes trigger_code = 3;
}

// ValidateAgentTokenRequest — ask mnemos to validate an AgentGateway
// bearer token (W3 part 2, ADR-0018-T §3 launch condition 2: the
// mnemos-side validation hook runs before the mesh forwards the FIRST
// agent request).
//
// TOKEN PLACEMENT (ADR-0018-T §2 — end-to-end rule): the token itself
// rides in gRPC `authorization` metadata ("Bearer <token>"), NEVER in
// this message. A token in a message field could reach query logs (T7)
// and breaks the "identity derives ONLY from the mnemos-validated
// token" rule (T3/T4). The core leg is already authenticated (UDS
// filesystem isolation or mesh-CA mTLS), so the metadata key cannot be
// spoofed by a third party — only the mesh dials this RPC.
message ValidateAgentTokenRequest {
  // The id of the mesh GATEWAY NODE that is serving the agent RPC and
  // asking for validation. mnemos enforces the token's `aud` node
  // binding against this value (early cross-node reuse rejection).
  string gateway_node_id = 1;
}

// ValidateAgentTokenResponse — the per-check validation verdict, a
// faithful wire mirror of mnemos's AgentTokenVerdict. Carries per-check
// outcomes (not a bare bool) so the gateway can rate-limit per agent,
// log a precise reject reason to the gateway_query category, and
// fast-fail — WITHOUT ever becoming an ACL authority (criterion 5:
// scope→ACL resolution stays mnemos-side on every data RPC).
message ValidateAgentTokenResponse {
  // True when the envelope verified: valid signature, v1, un-expired,
  // aud == the requesting gateway node, jti known and not revoked and
  // not past its rotation grace window. False means reject; see reason.
  bool valid = 1;

  // The agent identity (token `sub` claim) when derivable from the
  // envelope, else empty. The gateway uses this for rate-limit keying
  // and audit attribution — NEVER caller-asserted fields (T3/T4).
  string agent_id = 2;

  // The token's scope grants (e.g. ["read"] / ["rw"]). Informational
  // for the gateway's fast-fail write gate only; the effective scope
  // (token ∩ transport-peer ACL) is resolved per data RPC in mnemos.
  repeated string scope = 3;

  // The token id (jti) when derivable — logged for per-request
  // attribution (ADR-0018-T §5 anti-sharing), never the token value.
  string jti = 4;

  // The token's audience (`aud` claim) when derivable.
  string aud = 5;

  // True when iat <= now < exp held at validation time.
  bool exp_ok = 6;

  // True when the jti was found on the mnemos-side denylist.
  bool revoked = 7;

  // Reject reason when valid=false: malformed | bad_signature |
  // unsupported_version | expired | not_yet_valid | aud_mismatch |
  // unknown_jti | revoked | grace_expired. Empty when valid=true.
  string reason = 8;
}

// MnemosCore — the mesh↔mnemos core service over Unix socket + gRPC.
//
// Eight RPCs:
//   * ListMemories          — mnemos exports to mesh (mesh reads).
//   * ReadMemory            — single-record fetch by id (W3-v1 gateway
//                             read path, ADR-0018 amendment 3).
//   * WriteMemory           — mesh imports to mnemos (mesh writes).
//   * GetSubscriptionState  — cursor persistence (mesh reads on reconnect).
//   * Heartbeat             — liveness probe (both directions).
//   * SyncMetadata          — S2 export leg: mesh reads the federation
//                             index (metadata-only, ADR-0021 Q10.2).
//   * UpsertIndexEntries    — S2 import leg: mesh writes peer metadata
//                             into the federation index (ADR-0021).
//
// mnemos is the source of truth for storage AND moderation. The mesh is
// transport only: it never decrypts payloads, never accesses the SQLite
// store directly, never runs moderation. All moderation stays in Python.
service MnemosCore {
  // ListMemories — mnemos exports memories to the mesh, already
  // moderation-processed and compact-formatted. The mesh forwards the
  // resulting CompactRecord envelopes to peers over the FederationPeer API.
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);

  // ReadMemory — single-record fetch by id (W3-v1, ADR-0018 amendment 3).
  // Serves the AgentGateway read path: the mesh forwards an
  // AgentReadMemory RPC here after relaying the agent token in gRPC
  // metadata; mnemos applies the fail-closed effective-scope gate before
  // releasing the record. Additive — pre-W3 callers never see it.
  rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);

  // ValidateAgentToken — mnemos-side validation of an AgentGateway
  // bearer token (W3 part 2, ADR-0018-T §3 + §8 launch condition 2).
  // The mesh's AgentGateway calls this on EVERY agent RPC before
  // translating it to a data call: signature, version, TTL window,
  // `aud` node binding and the jti/sub denylists are checked here
  // (fail-closed on an unknown jti). The token rides in the
  // `authorization` metadata key, never in the request message.
  // Additive — pre-W3 callers never see it.
  rpc ValidateAgentToken(ValidateAgentTokenRequest)
      returns (ValidateAgentTokenResponse);

  // WriteMemory — mesh imports a CompactRecord from a peer into mnemos.
  // Idempotent by CompactRecord.id. mnemos may apply its own import
  // validation (#86) on top of the peer's moderation.
  rpc WriteMemory(WriteMemoryRequest) returns (WriteMemoryResponse);

  // GetSubscriptionState — read the persisted cursor/watermark for a
  // peer+project. The mesh uses this on (re)connect to decide where to
  // resume a Subscribe stream from.
  rpc GetSubscriptionState(GetSubscriptionStateRequest)
      returns (GetSubscriptionStateResponse);

  // Heartbeat — liveness probe between mesh and mnemos. Cheap unary call;
  // failure within a configured timeout marks the peer component as unhealthy.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // SyncMetadata — S2 meta-mirror EXPORT leg (ADR-0021 Q10.2 poll-first,
  // chairman ruling 2026-09-20): a page of the core's federation_index as
  // MetadataRecord entries, watermark-paginated over the index rowid
  // space (since_rev → latest_rev; the ADR-0020 rowid-walk mechanic).
  // Reuses the FederationPeer wire messages verbatim — the mesh relays
  // them to its peer leg without re-marshalling. Metadata-only: no
  // CompactRecord bodies, no content.
  rpc SyncMetadata(mnemos.federation.v1.MetadataSyncRequest)
      returns (mnemos.federation.v1.MetadataSyncResponse);

  // UpsertIndexEntries — S2 meta-mirror IMPORT leg (ADR-0021): upsert
  // peer metadata entries into the receiving core's federation_index.
  // Idempotent by id (LWW-by-timestamp); Q10.9 gates at import.
  rpc UpsertIndexEntries(UpsertIndexEntriesRequest)
      returns (UpsertIndexEntriesResponse);
}